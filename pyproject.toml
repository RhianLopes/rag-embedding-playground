[project]
name = "rag-embedding-playground"
version = "0.1.0"
description = "Educational RAG and Embeddings learning playground - fully local, zero API cost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Jupyter
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "notebook>=7.0",

    # Embeddings
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.2",
    "tokenizers>=0.19",

    # Vector DB
    "qdrant-client>=1.9",
    "fastembed>=0.3",

    # Local LLMs
    "ollama>=0.3",

    # RAG Frameworks
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "langgraph>=0.2",
    "llama-index-core>=0.11",
    "llama-index-llms-ollama>=0.3",
    "llama-index-embeddings-huggingface>=0.3",
    "haystack-ai>=2.5",

    # Evaluation
    "ragas>=0.2",

    # Data / Viz
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.17",
    "scikit-learn>=1.4",
    "umap-learn>=0.5",

    # Retrieval utils
    "rank-bm25>=0.2",
    "networkx>=3.2",

    # NLP utils
    "spacy>=3.7",

    # Dev utils
    "rich>=13.0",
    "python-dotenv>=1.0",
    "nbstripout>=0.7",
    "tqdm>=4.66",
    "httpx>=0.27",
    "pydantic>=2.0",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
